name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"   # อัปเดตทุก 12 ชั่วโมง
  workflow_dispatch:           # กดรันเองได้จากแท็บ Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0b2447&color_dots=#ebedf0,#c6e0ff,#8cc2ff,#4da3ff,#1e50a2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a5d6ff&color_dots=#161b22,#0b2447,#1e50a2,#3a7bd5,#4da3ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
